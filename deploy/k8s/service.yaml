apiVersion: v1
kind: Service
metadata:
  name: nemoclaw
  namespace: codicera-default
  labels:
    app: nemoclaw
    codicera.io/managed: "true"
spec:
  type: ClusterIP
  ports:
    - port: 18789
      targetPort: api
      protocol: TCP
      name: api
    - port: 18790
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: nemoclaw
