replicaCount: 1

image:
  repository: ghcr.io/infrastacks/nemoclaw
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

codicera:
  endpoint: "https://codicera-api.infrastacks.workers.dev"
  sandboxId: ""
  orgId: ""

resources:
  limits:
    cpu: "4"
    memory: 8Gi
  requests:
    cpu: "1"
    memory: 2Gi

gpu:
  enabled: false
  count: 1

service:
  type: ClusterIP
  apiPort: 18800

serviceAccount:
  create: true
  annotations: {}
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
