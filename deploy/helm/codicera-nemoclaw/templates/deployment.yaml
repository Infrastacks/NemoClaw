apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codicera-nemoclaw.fullname" . }}
  labels:
    {{- include "codicera-nemoclaw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "codicera-nemoclaw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "codicera-nemoclaw.selectorLabels" . | nindent 8 }}
        codicera.io/sandbox-id: {{ .Values.codicera.sandboxId | quote }}
        codicera.io/org-id: {{ .Values.codicera.orgId | quote }}
        codicera.io/managed: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "codicera-nemoclaw.serviceAccountName" . }}
      containers:
        - name: nemoclaw
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 18789
              protocol: TCP
            - name: metrics
              containerPort: 18790
              protocol: TCP
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.nemoclaw | nindent 12 }}
          {{- if .Values.gpu.enabled }}
            limits:
              nvidia.com/gpu: {{ .Values.gpu.count | quote }}
          {{- end }}
        - name: agent
          image: "{{ .Values.agentImage.repository | default .Values.image.repository }}:{{ .Values.agentImage.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CODICERA_ENDPOINT
              value: {{ .Values.codicera.endpoint | quote }}
            - name: SANDBOX_ID
              value: {{ .Values.codicera.sandboxId | quote }}
            - name: ORG_ID
              value: {{ .Values.codicera.orgId | quote }}
          resources:
            {{- toYaml .Values.resources.agent | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
