apiVersion: v1
kind: Service
metadata:
  name: {{ include "codicera-nemoclaw.fullname" . }}
  labels:
    {{- include "codicera-nemoclaw.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: api
      protocol: TCP
      name: api
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "codicera-nemoclaw.selectorLabels" . | nindent 4 }}
