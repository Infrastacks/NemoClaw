name: Build and Push Container Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: infrastacks/nemoclaw

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Build single-arch image for testing (load: true requires single platform)
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: nemoclaw:test
          secrets: |
            github_token=${{ secrets.CODICERA_TOKEN }}
          cache-from: type=gha

      # Checkout CAR tests from private codicera repo
      - name: Checkout CAR tests
        uses: actions/checkout@v4
        with:
          repository: Infrastacks/codicera
          token: ${{ secrets.CODICERA_TOKEN }}
          path: codicera
          sparse-checkout: |
            car/tests

      # Run CAR test suite inside the built container (override entrypoint)
      - name: Run CAR tests
        run: |
          docker run --rm --entrypoint sh \
            -v "$GITHUB_WORKSPACE/codicera/car/tests:/opt/tests" \
            nemoclaw:test \
            -c "pip install --no-cache-dir pytest pytest-asyncio && python -m pytest /opt/tests -v --tb=short"

      # Multi-arch build and push (only on push to main or tags)
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_token=${{ secrets.CODICERA_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
