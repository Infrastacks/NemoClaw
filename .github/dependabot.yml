version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies, chore]

  - package-ecosystem: npm
    directory: /nemoclaw
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies, chore]

  - package-ecosystem: pip
    directory: /nemoclaw-blueprint
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, chore]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
