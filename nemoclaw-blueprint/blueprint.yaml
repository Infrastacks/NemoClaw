version: "2.0.0"
min_openshell_version: "0.1.0"
digest: ""  # Computed at release time

runtime:
  framework: car
  version: "1.0.0"

profiles:
  - default
  - ncp
  - azure
  - nim-local
  - vllm

description: |
  NemoClaw blueprint: governed agent execution via Codicera Agent Runtime (CAR),
  multi-provider inference routing, and OpenShell kernel-level sandboxing.

components:
  sandbox:
    image: "codiceraimages.azurecr.io/nemoclaw:latest"
    name: "nemoclaw"
    forward_ports:
      - 18800

  inference:
    profiles:
      default:
        provider_type: "nvidia"
        provider_name: "nvidia-inference"
        endpoint: "https://integrate.api.nvidia.com/v1"
        model: "nvidia/nemotron-3-super-120b-a12b"

      ncp:
        provider_type: "nvidia"
        provider_name: "nvidia-ncp"
        endpoint: ""
        model: "nvidia/nemotron-3-super-120b-a12b"
        credential_env: "NVIDIA_API_KEY"
        dynamic_endpoint: true

      azure:
        provider_type: "openai"
        provider_name: "azure-openai"
        endpoint: ""
        model: ""
        credential_env: "AZURE_OPENAI_API_KEY"
        dynamic_endpoint: true

      nim-local:
        provider_type: "openai"
        provider_name: "nim-local"
        endpoint: "http://nim-service.local:8000/v1"
        model: "nvidia/nemotron-3-super-120b-a12b"
        credential_env: "NIM_API_KEY"

      vllm:
        provider_type: "openai"
        provider_name: "vllm-local"
        endpoint: "http://localhost:8000/v1"
        model: "nvidia/nemotron-3-nano-30b-a3b"
        credential_env: "OPENAI_API_KEY"
        credential_default: "dummy"

  policy:
    base: "sandboxes/nemoclaw/policy.yaml"
    additions:
      nim_service:
        name: nim_service
        endpoints:
          - host: "nim-service.local"
            port: 8000
            protocol: rest
