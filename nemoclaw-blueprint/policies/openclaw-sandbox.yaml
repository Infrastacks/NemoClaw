#
# Minimal baked-in policy for the OpenClaw sandbox.
# Principle: deny by default. Only OS-level (filesystem/process) and the
# management-plane bootstrap endpoint are baked in here.
#
# All network policies (inference, git, package registries, web search, etc.)
# are dynamically injected via CODICERA_POLICIES at container startup and
# merged by entrypoint.sh into this base file.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# ── PII detection (L7 inspection via OpenShell CONNECT proxy) ────
# Defaults to audit mode; overridden by Codicera policy push.
pii:
  enforcement: audit
  max_body_bytes: 1048576

# ── Network: management plane only ──────────────────────────────
# The agent needs this to bootstrap its connection to the Codicera API
# before dynamic policies from CODICERA_POLICIES are loaded.
network_policies:
  management_plane:
    name: management_plane
    endpoints:
      - host: "*.infrastacks.workers.dev"
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: "*", path: "/**" }
